name: Binary (Debug)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version'
        required: true
        default: 1.5.4dev
      os:
        description: 'OS'
        required: true
        default: macos-latest
      compiler:
        description: 'Complier'
        required: true
        default: clang++

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release
  VERSION: ${{ github.event.inputs.version }}
  CMAKE_BUILD_PARALLEL_LEVEL: 8

jobs:
  build:
    runs-on: ${{ github.event.inputs.os }}
    steps:

    - uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Setup libomp (macOS)
      if: contains(github.event.inputs.os, 'macos')
      shell: bash
      run: |
        brew install libomp
        BREW_PREFIX=$(brew --prefix libomp)
        echo "LDFLAGS=-L${BREW_PREFIX}/lib" >> $GITHUB_ENV
        echo "CPPFLAGS=-I${BREW_PREFIX}/include" >> $GITHUB_ENV
        echo "OpenMP_ROOT=${BREW_PREFIX}" >> $GITHUB_ENV
        
    - name: Configure CMake
      env:
        CXX: ${{ github.event.inputs.compiler }}
      shell: bash
      working-directory: ${{github.workspace}}
      run: |
        cmake -B ./build \
          -DCMAKE_CXX_COMPILER=${{ github.event.inputs.compiler }} \
          -DCMAKE_BUILD_TYPE=$BUILD_TYPE \
          -DBUILD_PYSCAFFOLDER=OFF \
          -DVERSION=$VERSION
      
    - name: Build
      working-directory: ${{github.workspace}}/build
      shell: bash
      run: cmake --build . --config $BUILD_TYPE

    - name: Run Tests (Windows)
      shell: bash
      working-directory: ${{github.workspace}}/build/${BUILD_TYPE}
      if: contains(github.event.inputs.os, 'windows')
      run: |
        ./Scaffolder.exe
        ./Scaffolder.SliceTest.exe

    - name: Run Tests (Linux/macOS)
      shell: bash
      if: contains(github.event.inputs.os, 'ubuntu') || contains(github.event.inputs.os, 'macos')
      working-directory: ${{github.workspace}}/build
      run: |
        ./Scaffolder
        ./Scaffolder.SliceTest

