name: Binary (Debug)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version'
        required: true
        default: 1.5.4dev
      os:
        description: 'OS'
        required: true
        default: macos-latest
      compiler:
        description: 'Complier'
        required: true
        default: clang++

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release
  VERSION: ${{ github.event.inputs.version }}
  CMAKE_BUILD_PARALLEL_LEVEL: 8

jobs:
  build:
    runs-on: ${{ github.event.inputs.os }}
    steps:

    - uses: actions/checkout@v7
      with:
        submodules: true

    - name: Build universal libomp from source (macOS)
      if: contains(github.event.inputs.os, 'macos')
      shell: bash
      run: |
        git clone --depth 1 --branch llvmorg-22.1.8 https://github.com/llvm/llvm-project.git
        cmake -S llvm-project/openmp -B openmp-build \
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
          -DCMAKE_C_COMPILER=clang \
          -DCMAKE_CXX_COMPILER=clang++ \
          -DCMAKE_INSTALL_PREFIX=/opt/libomp-universal
        cmake --build openmp-build -j$(sysctl -n hw.logicalcpu)
        sudo cmake --install openmp-build
        lipo -archs /opt/libomp-universal/lib/libomp.dylib

    - name: Create Build Environment
      run: cmake -E make_directory ${{github.workspace}}/build

    - name: Configure CMake
      shell: bash
      working-directory: ${{github.workspace}}/build
      env:
        CXX: ${{ github.event.inputs.compiler }}
      run: |
        cmake $GITHUB_WORKSPACE \
          -DCMAKE_CXX_COMPILER=${{ github.event.inputs.compiler }} \
          -DCMAKE_BUILD_TYPE=$BUILD_TYPE \
          -DBUILD_PYSCAFFOLDER=OFF \
          -DVERSION=$VERSION
      
    - name: Build
      working-directory: ${{github.workspace}}/build
      shell: bash
      run: cmake --build . --config $BUILD_TYPE

  test:
    needs: build
    runs-on: ${{ github.event.inputs.os }}
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: true

    - name: Run Tests (Windows)
      shell: bash
      working-directory: ${{github.workspace}}/build
      if: contains(github.event.inputs.os, 'windows')
      run: |
        ./Scaffolder.exe
        ./Scaffolder.SliceTest.exe

    - name: Run Tests (Linux/macOS)
      shell: bash
      if: contains(github.event.inputs.os, 'linux') || contains(github.event.inputs.os, 'macos')
      working-directory: ${{github.workspace}}/build
      run: |
        ./Scaffolder
        ./Scaffolder.SliceTest

