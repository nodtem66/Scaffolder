name: Binary

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: 'Version'
        required: true
        default: dev

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release
  VERSION: ${{ github.event.inputs.version }}
  CMAKE_BUILD_PARALLEL_LEVEL: 8

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: ubuntu-latest
          compiler: g++
        - os: macos-latest
          compiler: clang++
        - os: windows-latest
          compiler: cl
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true

    - name: Build universal libomp from source (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        git clone --depth 1 --branch llvmorg-18.1.8 https://github.com/llvm/llvm-project.git
        cmake -S llvm-project/openmp -B openmp-build \
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
          -DCMAKE_C_COMPILER=clang \
          -DCMAKE_CXX_COMPILER=clang++ \
          -DCMAKE_INSTALL_PREFIX=/opt/libomp-universal
        cmake --build openmp-build -j$(sysctl -n hw.logicalcpu)
        sudo cmake --install openmp-build
        lipo -archs /opt/libomp-universal/lib/libomp.dylib

    - name: Create Build Environment
      run: cmake -E make_directory ${{github.workspace}}/build

    - name: Configure CMake
      shell: bash
      working-directory: ${{github.workspace}}/build
      env:
        CXX: ${{ matrix.compiler }}
      run: |
        cmake $GITHUB_WORKSPACE \
          -DCMAKE_CXX_COMPILER=${{ matrix.compiler }} \
          -DCMAKE_BUILD_TYPE=$BUILD_TYPE \
          -DBUILD_PYSCAFFOLDER=OFF \
          -DVERSION=$VERSION
      
    - name: Build
      working-directory: ${{github.workspace}}/build
      shell: bash
      run: cmake --build . --config $BUILD_TYPE
      
    - name: Upload binary
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.os }}
        retention-days: 1
        path: |
          ${{github.workspace}}/build/**/Scaffolder
          ${{github.workspace}}/build/**/Scaffolder.SliceTest
          ${{github.workspace}}/build/**/Scaffolder.exe
          ${{github.workspace}}/build/**/Scaffolder.SliceTest.exe
          ${{github.workspace}}/build/**/*.dll
          ${{github.workspace}}/build/**/*.pdb
          ${{github.workspace}}/build/**/*.so
          ${{github.workspace}}/build/**/*.pyd
          ${{github.workspace}}/build/**/*.exp
          ${{github.workspace}}/build/**/*.lib
          ${{github.workspace}}/build/**/*.dylib
          !${{github.workspace}}/build/**/lua*
  release:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ubuntu-latest
          path: ubuntu

      - uses: actions/download-artifact@v4
        with:
          name: macos-latest
          path: macos

      - uses: actions/download-artifact@v4
        with:
          name: windows-latest
          path: windows 

      - name: List files
        run: ls -R

      - name: Upload Release
        uses: softprops/action-gh-release@v3
        if: github.ref_type == 'tag'
        with:
          files: |
            ubuntu/**/*Scaffolder*
            ubuntu/**/*.so
            macos/**/*Scaffolder*
            macos/**/*.dylib
            windows/**/*Scaffolder*
            windows/**/*.dll
            windows/**/*.pdb
          generate_release_notes: true
          fail_on_unmatched_files: false
